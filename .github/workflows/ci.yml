name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format Check
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 24
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Lint with ruff
        run: ruff check flight_pipeline/
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 24
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  sample-ingest:
    runs-on: ubuntu-latest
    name: Sample Dry-Run Ingest
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 24
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run sample dry-run ingest (validates logic)
        run: |
          cd flight_pipeline
          python pipelines/run_ingestion.py --source all --dry-run --log-level INFO
        continue-on-error: true
        env:
          # Dummy DB string for dry-run (not actually used)
          FLIGHT_PIPELINE_DB_DSN: postgresql://dummy:dummy@localhost:5432/dummy
          # OpenSky is disabled in registry/sources.yaml, so no credentials needed
