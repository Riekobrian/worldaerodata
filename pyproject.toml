[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-pipeline"
version = "0.1.0"
description = "Declarative free flight data ingestion pipeline for learning."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "PyYAML>=6.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["connectors*", "mappers*", "models*", "pipelines*", "utils*", "registry*", "sql*"]
exclude = ["declaflights*", "tests*", "samples*", "explorers*", ".*"]
